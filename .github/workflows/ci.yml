name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llmvero:ci .
      - name: Smoke test
        run: |
          docker run -d --name llmvero -p 8000:8000 -e PROVIDER=mock llmvero:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/v1/generate -H 'content-type: application/json' \
            -d '{"documents":[{"text":"LLMvero turns app data into training data. It runs anywhere."}]}'
